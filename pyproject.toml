[build-system]
requires = [
    "setuptools>=80",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "OpenCobol2"
version = "0.1.0.dev0"
description = "A modern COBOL integrated development environment built on the foundations of OpenCobolIDE."
readme = "README.MD"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE"
]

authors = [
    { name = "Mitchell Aikens", email = "mitchaikenspayments@gmail.com" }
]

maintainers = [
    { name = "Mitchell Aikens", email = "mitchaikenspayments@gmail.com" }
]

keywords = [
    "COBOL",
    "GnuCOBOL",
    "IDE",
    "mainframe",
    "z/OS",
    "editor",
    "compiler",
    "development",
    "Git",
    "GitHub"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: COBOL",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Integrated Environments (IDE)",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)"
]

dependencies = [
    "PySide6>=6.10",
    "platformdirs>=4"
]

[project.urls]
Homepage = "https://github.com/msaikens/OpenCobol2"
Repository = "https://github.com/msaikens/OpenCobol2"
Issues = "https://github.com/msaikens/OpenCobol2/issues"
Changelog = "https://github.com/msaikens/OpenCobol2/releases"


[project.optional-dependencies]
test = [
    "pytest>=9",
    "pytest-cov>=7"
]

dev = [
    "build>=1.4",
    "pytest>=9",
    "pytest-cov>=7"
]


[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true


[tool.setuptools.packages.find]
where = [
    "src"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

addopts = [
    "--strict-config",
    "--strict-markers"
]